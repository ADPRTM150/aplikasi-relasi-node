<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light only" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <title>Login Admin - QUALITY OF LOVE</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- CSS Admin (Umum) -->
    <link rel="stylesheet" href="/admin/css/style.css" />

    <!-- CSS Login Admin (Khusus) -->
    <link rel="stylesheet" href="/admin/css/login.css" />

    <style>
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: #fff;
            color: #333;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 16px;
        }
        .google-btn:hover {
            border-color: #6C63FF;
            box-shadow: 0 4px 16px rgba(108,99,255,0.15);
        }
        .google-btn img {
            width: 22px;
            height: 22px;
        }
        .divider-text {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin: 12px 0;
            position: relative;
        }
        .divider-text::before,
        .divider-text::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 35%;
            height: 1px;
            background: #e0e0e0;
        }
        .divider-text::before { left: 0; }
        .divider-text::after { right: 0; }
        .step-section {
            display: none;
        }
        .step-section.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="admin-body">
        <div class="login-container">
            <div class="logo">❤️ QUALITY OF LOVE<span>Admin</span></div>
            <p class="subtitle">Login untuk mengelola konten & data</p>

            <!-- 🔥 STEP 1: Login Google dulu -->
            <div id="stepGoogle" class="step-section active">
                <p style="text-align:center;color:#666;font-size:14px;margin-bottom:16px;">
                    Login dengan Google dulu untuk akses database
                </p>
                <button class="google-btn" onclick="loginGoogle()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
                    Login dengan Google
                </button>
            </div>

            <!-- 🔥 STEP 2: Baru login admin -->
            <div id="stepAdmin" class="step-section">
                <div id="userInfo" style="background:#e6f2f0;padding:8px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;color:#2d635e;"></div>

                <div class="divider-text">Login Admin</div>

                <div class="error-message" id="errorMessage">
                    ⚠️ <span id="errorText">Email atau password salah.</span>
                </div>

                <form id="loginForm" onsubmit="loginAdmin(event)">
                    <div class="form-group">
                        <label>📧 Email Admin</label>
                        <input type="email" id="adminEmail" placeholder="Masukkan email admin" required />
                    </div>
                    <div class="form-group">
                        <label>🔑 Password</label>
                        <input type="password" id="adminPassword" placeholder="Masukkan password" required />
                    </div>
                    <button type="submit" class="btn-login">
                        <span>🚪</span> Masuk Dashboard
                    </button>
                </form>
            </div>

            <a href="/" class="back-link">← Kembali ke Beranda</a>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="/firebase-config.js"></script>

    <script>
        const errorDiv = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const stepGoogle = document.getElementById('stepGoogle');
        const stepAdmin = document.getElementById('stepAdmin');

        // ============================================================
        //  🔥 CEK FIREBASE AUTH SAAT HALAMAN LOAD
        // ============================================================
        firebase.auth().onAuthStateChanged(function(user) {
            if (user) {
                // Sudah login Google → langsung tampilkan form admin
                stepGoogle.classList.remove('active');
                stepAdmin.classList.add('active');
                document.getElementById('userInfo').textContent = '✅ ' + (user.displayName || user.email);

                // Kalau sudah login admin sebelumnya → langsung ke dashboard
                if (localStorage.getItem('isAdmin') === 'true') {
                    window.location.href = '/admin';
                }
            } else {
                // Belum login Google → tampilkan tombol Google
                stepGoogle.classList.add('active');
                stepAdmin.classList.remove('active');
            }
        });

        // ============================================================
        //  🔥 LOGIN GOOGLE
        // ============================================================
        function loginGoogle() {
            var btn = document.querySelector('.google-btn');
            btn.disabled = true;
            btn.textContent = 'Memproses...';

            var provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider)
                .catch(function(error) {
                    console.error('Google login error:', error);
                    btn.disabled = false;
                    btn.innerHTML = '<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" /> Login dengan Google';

                    errorText.textContent = 'Gagal login Google: ' + error.message;
                    errorDiv.classList.add('show');
                    setTimeout(function() { errorDiv.classList.remove('show'); }, 5000);
                });
        }

        // ============================================================
        //  LOGIN ADMIN
        // ============================================================
        function loginAdmin(e) {
            e.preventDefault();

            if (!firebase.auth().currentUser) {
                errorText.textContent = 'Login Google dulu sebelum masuk admin!';
                errorDiv.classList.add('show');
                stepGoogle.classList.add('active');
                stepAdmin.classList.remove('active');
                return;
            }

            var email = document.getElementById('adminEmail').value;
            var password = document.getElementById('adminPassword').value;
            var btn = document.querySelector('.btn-login');
            btn.disabled = true;
            btn.innerHTML = '<span>⏳</span> Memproses...';

            // 🔥 Panggil server API untuk verifikasi admin
            fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.success) {
                    // Simpan token JWT
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('isAdmin', 'true');
                    localStorage.setItem('adminEmail', email);
                    localStorage.setItem('adminName', email.split('@')[0] || 'Admin');
                    window.location.href = '/admin';
                } else {
                    btn.disabled = false;
                    btn.innerHTML = '<span>🚪</span> Masuk Dashboard';
                    errorText.textContent = data.message || 'Email atau password salah!';
                    errorDiv.classList.add('show');
                    setTimeout(function() { errorDiv.classList.remove('show'); }, 4000);
                }
            })
            .catch(function(err) {
                console.error('Login error:', err);
                btn.disabled = false;
                btn.innerHTML = '<span>🚪</span> Masuk Dashboard';
                errorText.textContent = 'Terjadi kesalahan server. Coba lagi.';
                errorDiv.classList.add('show');
                setTimeout(function() { errorDiv.classList.remove('show'); }, 4000);
            });
        }
    </script>

</body>
</html>
