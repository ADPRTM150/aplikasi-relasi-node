<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light only" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <title>Ebook - QUALITY OF LOVE</title>

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="/css/style.css" />

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="/firebase-config.js"></script>
</head>

<body>

    <div class="app">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="logo"><strong>QUALITY OF LOVE</strong>🌱</div>
            <div style="display:flex;align-items:center;gap:10px;">
                <span class="badge">Beta</span>
                <div class="user-area" id="userArea">
                    <!-- Akan diisi JavaScript -->
                </div>
            </div>
        </div>

        <!-- ===== KONTEN DETAIL EBOOK ===== -->
        <div class="artikel-detail" id="detailContainer">
            <a href="/artikel" class="back-link" onclick="kembaliKeEbook(event)">← Kembali ke Artikel &amp; Ebook</a>
            <div id="ebookContent">
                <div class="loading-text">⏳ Memuat ebook...</div>
            </div>
            <div id="buyArea" style="margin-top:20px;"></div>
        </div>

        <!-- ===== BOTTOM NAV ===== -->
        <div class="bottom-nav">
            <a href="/">
                <span class="nav-icon">🏠</span>
                Beranda
            </a>
            <a href="/love-language">
                <span class="nav-icon">❤️</span>
                Love
            </a>
            <a href="/relationship-check">
                <span class="nav-icon">💕</span>
                Health
            </a>
            <a href="/artikel">
                <span class="nav-icon">📰</span>
                Artikel
            </a>
            <a href="/artikel?tab=ebook" class="active">
                <span class="nav-icon">📚</span>
                Ebook
            </a>
        </div>

    </div>

    <script>
        // ============================================================
        //  FIREBASE AUTH - RENDER USER
        // ============================================================
        firebase.auth().onAuthStateChanged((user) => {
            const userArea = document.getElementById('userArea');
            if (user) {
                const foto = user.photoURL || '';
                const nama = user.displayName || 'Pengguna';
                userArea.innerHTML = `
                    <button class="profile-trigger" onclick="toggleDropdown()">
                        ${foto ? `<img src="${foto}" class="avatar" />` : `<div class="avatar-placeholder">👤</div>`}
                    </button>
                    <div class="user-dropdown" id="userDropdown">
                        <a href="/profil" class="dropdown-item">👤 Profil</a>
                        <a href="/hasil" class="dropdown-item">📊 Hasil</a>
                        <a href="/love-language" class="dropdown-item">❤️ Love Language</a>
                        <a href="/relationship-check" class="dropdown-item">💕 Health Check</a>
                        <a href="/artikel" class="dropdown-item">📰 Artikel</a>
                        <a href="/ebook" class="dropdown-item">📚 Ebook</a>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item logout" onclick="logout()">🚪 Logout</button>
                    </div>
                `;
            } else {
                userArea.innerHTML = `
                    <button class="profile-trigger" onclick="window.location.href='/login'">
                        <div class="avatar-placeholder">👤</div>
                    </button>
                `;
            }
        });

        function toggleDropdown() {
            const d = document.getElementById('userDropdown');
            if (d) d.classList.toggle('show');
        }

        document.addEventListener('click', function(e) {
            const area = document.getElementById('userArea');
            if (area && !area.contains(e.target)) {
                const d = document.getElementById('userDropdown');
                if (d) d.classList.remove('show');
            }
        });

        function logout() {
            if (confirm('Yakin ingin logout?')) {
                firebase.auth().signOut().then(() => {
                    window.location.reload();
                });
            }
        }

        // ============================================================
        //  🔥 KEMBALI KE EBOOK
        // ============================================================
        function kembaliKeEbook(e) {
            e.preventDefault();
            window.location.replace('/artikel');
        }

        // ============================================================
        //  🔥 STATE PEMBELIAN
        // ============================================================
        var ebookId = null;
        var ebookData = null;
        var snapConfig = null;
        var pollTimer = null;
        var pollAttempts = 0;
        var lastRedirectUrl = null;
        var lastToken = null;

        // ============================================================
        //  🔥 AMBIL KONFIGURASI (untuk Snap Midtrans)
        // ============================================================
        async function loadSnapConfig() {
            try {
                var res = await fetch('/api/config');
                snapConfig = await res.json();
            } catch (e) {
                snapConfig = { midtransEnabled: false };
            }
        }

        // ============================================================
        //  🔥 AMBIL DETAIL EBOOK DARI FIRESTORE
        // ============================================================
        async function loadEbookDetail() {
            var container = document.getElementById('ebookContent');
            var urlParams = new URLSearchParams(window.location.search);
            ebookId = urlParams.get('id');

            if (!ebookId) {
                container.innerHTML = '<div class="error-state"><div class="icon">⚠️</div><p>Ebook tidak ditemukan.</p></div>';
                return;
            }

            try {
                var doc = await db.collection('ebooks').doc(ebookId).get();
                if (!doc.exists || !doc.data() || doc.data().status !== 'published') {
                    container.innerHTML = '<div class="error-state"><div class="icon">📭</div><p>Ebook tidak ditemukan.</p></div>';
                    return;
                }

                var e = doc.data();
                ebookData = e;
                var tanggal = e.createdAt ? new Date(e.createdAt.toDate()).toLocaleDateString('id-ID', {
                    day: 'numeric', month: 'long', year: 'numeric'
                }) : '-';
                var harga = (Number(e.price) || 0) > 0
                    ? 'Rp ' + Number(e.price).toLocaleString('id-ID')
                    : 'Gratis';

                container.innerHTML = `
                    <div class="thumb">${e.thumb || '📘'}</div>
                    <span class="kategori">${e.category || 'Lainnya'}</span>
                    <h1>${e.title}</h1>
                    <div class="meta">📅 ${tanggal} · 📄 ${e.pages || 0} halaman · 💰 ${harga}</div>
                    <div class="content"><p>${e.desc || 'Deskripsi belum tersedia.'}</p></div>
                `;
                document.title = e.title + ' - QUALITY OF LOVE';

                renderBuyArea();
            } catch (error) {
                console.error('Error loading ebook detail:', error);
                container.innerHTML = '<div class="error-state"><div class="icon">❌</div><p>Gagal memuat ebook. Silakan refresh halaman.</p></div>';
            }
        }

        // ============================================================
        //  🔥 RENDER AREA BELI / UNDUH
        // ============================================================
        function renderBuyArea() {
            var area = document.getElementById('buyArea');
            if (!ebookData) return;
            var price = Number(ebookData.price) || 0;

            if (price <= 0) {
                // 🔥 EBOOK GRATIS — langsung unduh
                if (ebookData.fileUrl) {
                    area.innerHTML = `
                        <button onclick="window.open('${ebookData.fileUrl}', '_blank')"
                            style="background:linear-gradient(135deg,#3a7d76,#2d655f);color:#fff;border:none;padding:14px 28px;border-radius:50px;font-size:16px;font-weight:600;width:100%;cursor:pointer;">
                            ⬇️ Unduh Ebook (Gratis)
                        </button>`;
                } else {
                    area.innerHTML = '<p style="color:#8a9e99;font-size:13px;text-align:center;">File ebook belum tersedia. Coba lagi nanti.</p>';
                }
                return;
            }

            // 🔥 EBOOK BERBAYAR
            area.innerHTML = `
                <div style="text-align:center;">
                    <p style="font-size:20px;font-weight:700;color:#1d3b36;margin:0 0 12px;">Rp ${price.toLocaleString('id-ID')}</p>
                    <button id="btnBeli" onclick="beliEbook()"
                        style="background:linear-gradient(135deg,#e0567a,#c94a6e);color:#fff;border:none;padding:14px 28px;border-radius:50px;font-size:16px;font-weight:600;width:100%;cursor:pointer;">
                        🛒 Beli Sekarang
                    </button>
                    <p style="color:#8a9e99;font-size:11px;margin-top:8px;">Pembayaran aman via Midtrans (QRIS, VA, e-wallet)</p>
                </div>`;

            // Pulihkan order yang belum selesai (termasuk setelah reload halaman)
            var savedOrderId = sessionStorage.getItem('ebookOrder_' + ebookId);
            if (savedOrderId) {
                lastToken = sessionStorage.getItem('ebookToken_' + ebookId) || null;
                lastRedirectUrl = sessionStorage.getItem('ebookRedirect_' + ebookId) || null;
                cekStatusOrder(savedOrderId, false);
            }
        }

        // ============================================================
        //  🔥 PROSES BELI
        // ============================================================
        async function beliEbook() {
            var user = firebase.auth().currentUser;
            if (!user) {
                if (confirm('Kamu harus login dulu untuk membeli ebook. Login sekarang?')) {
                    window.location.href = '/login';
                }
                return;
            }

            var idToken;
            try {
                idToken = await user.getIdToken();
            } catch (e) {
                showBuyMessage('Gagal autentikasi. Silakan refresh halaman.', 'error');
                return;
            }

            var btn = document.getElementById('btnBeli');
            if (btn) { btn.disabled = true; btn.textContent = '⏳ Membuat pesanan...'; }

            try {
                var res = await fetch('/api/public/ebooks/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
                    body: JSON.stringify({ ebookId: ebookId })
                });
                var data = await res.json();

                if (!data.success) {
                    showBuyMessage(data.message || 'Gagal membuat pesanan.', 'error');
                    if (btn) { btn.disabled = false; btn.textContent = '🛒 Beli Sekarang'; }
                    return;
                }

                sessionStorage.setItem('ebookOrder_' + ebookId, data.orderId);
                sessionStorage.setItem('ebookToken_' + ebookId, data.token || '');
                sessionStorage.setItem('ebookRedirect_' + ebookId, data.redirectUrl || '');
                lastRedirectUrl = data.redirectUrl || null;
                lastToken = data.token || null;

                // Tampilkan status menunggu + link cadangan (kalau popup bermasalah)
                showWaitingWithLink();

                // Load Snap JS
                if (!snapConfig || !snapConfig.midtransEnabled) {
                    if (btn) { btn.disabled = false; btn.textContent = '🛒 Beli Sekarang'; }
                    return;
                }

                loadSnapThenPay(function() { snapPay(data.token); });
            } catch (error) {
                console.error('Order error:', error);
                showBuyMessage('Gagal membuat pesanan. Coba lagi.', 'error');
                if (btn) { btn.disabled = false; btn.textContent = '🛒 Beli Sekarang'; }
            }
        }

        function snapPay(token) {
            window.snap.pay(token, {
                onSuccess: function() { cekStatusOrder(sessionStorage.getItem('ebookOrder_' + ebookId), true); },
                onPending: function() { cekStatusOrder(sessionStorage.getItem('ebookOrder_' + ebookId), false); },
                onError: function() { cekStatusOrder(sessionStorage.getItem('ebookOrder_' + ebookId), false); },
                onClose: function() { cekStatusOrder(sessionStorage.getItem('ebookOrder_' + ebookId), false); }
            });
        }

        // ============================================================
        //  🔥 CEK STATUS ORDER (POLLING)
        // ============================================================
        function cekStatusOrder(orderId, immediate) {
            if (!orderId) return;
            pollAttempts = 0;
            if (immediate) checkOnce(orderId);
            else pollStatus(orderId);
        }

        function pollStatus(orderId) {
            if (pollTimer) clearInterval(pollTimer);
            checkOnce(orderId);
            pollTimer = setInterval(function() {
                pollAttempts++;
                if (pollAttempts > 10) { clearInterval(pollTimer); return; }
                checkOnce(orderId);
            }, 4000);
        }

        async function checkOnce(orderId) {
            try {
                var res = await fetch('/api/public/ebooks/order/' + orderId);
                var data = await res.json();
                if (!data.success) return;

                if (data.status === 'success') {
                    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
                    if (data.fileUrl) {
                        document.getElementById('buyArea').innerHTML = `
                            <div style="text-align:center;">
                                <p style="color:#3a7d76;font-weight:600;font-size:15px;margin-bottom:12px;">✅ Pembayaran berhasil!</p>
                                <button onclick="window.open('${data.fileUrl}', '_blank')"
                                    style="background:linear-gradient(135deg,#3a7d76,#2d655f);color:#fff;border:none;padding:14px 28px;border-radius:50px;font-size:16px;font-weight:600;width:100%;cursor:pointer;">
                                    ⬇️ Unduh Ebook
                                </button>
                            </div>`;
                    } else {
                        showBuyMessage('Pembayaran berhasil, tapi file belum tersedia.', 'error');
                    }
                    return;
                }
                if (data.status === 'pending') {
                    showWaitingWithLink();
                    return;
                }
                if (data.status === 'failed') {
                    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
                    showBuyMessage('❌ Pembayaran gagal atau dibatalkan. Silakan coba lagi.', 'error');
                    renderBuyArea(); // reset tombol beli
                }
            } catch (e) { /* ignore, lanjut poll */ }
        }

        function showBuyMessage(msg, type) {
            var area = document.getElementById('buyArea');
            var color = type === 'error' ? '#c94a6e' : (type === 'info' ? '#d4a373' : '#3a7d76');
            area.innerHTML = `<p style="color:${color};font-size:13px;text-align:center;font-weight:600;">${msg}</p>`;
        }

        // Tampilkan status menunggu + tombol tampilkan popup lagi + link tab baru (cadangan)
        function showWaitingWithLink() {
            var area = document.getElementById('buyArea');
            var reopenHtml = lastToken
                ? `<button onclick="reopenSnapPopup()"
                       style="display:inline-block;margin-top:10px;background:linear-gradient(135deg,#e0567a,#c94a6e);color:#fff;border:none;padding:12px 24px;border-radius:50px;font-size:14px;font-weight:600;cursor:pointer;">
                       🔄 Tampilkan Popup Pembayaran Lagi
                   </button>`
                : '';
            var linkHtml = lastRedirectUrl
                ? `<a href="${lastRedirectUrl}" target="_blank" rel="noopener"
                       style="display:inline-block;margin-top:10px;background:linear-gradient(135deg,#3a7d76,#2d655f);color:#fff;border:none;padding:12px 24px;border-radius:50px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;">
                       💳 Buka halaman pembayaran di tab baru
                   </a>
                   <p style="color:#8a9e99;font-size:11px;margin-top:8px;">Popup tertutup? Tampilkan lagi atau bayar lewat halaman penuh di atas.</p>`
                : '';
            area.innerHTML = `
                <div style="text-align:center;">
                    <p style="color:#d4a373;font-weight:600;font-size:14px;margin:0;">⏳ Menunggu pembayaran dikonfirmasi...</p>
                    ${reopenHtml}
                    ${linkHtml}
                    <p style="margin-top:14px;">
                        <a href="javascript:void(0)" onclick="batalkanOrder()"
                           style="color:#8a9e99;font-size:12px;text-decoration:underline;">❌ Batalkan &amp; buat pesanan baru</a>
                    </p>
                </div>`;
        }

        // Muat snap.js bila belum ada, lalu jalankan callback
        function loadSnapThenPay(callback) {
            if (typeof window.snap !== 'undefined') { callback(); return; }
            if (!snapConfig || !snapConfig.midtransEnabled) {
                showBuyMessage('Pembayaran belum dikonfigurasi. Hubungi admin.', 'error');
                return;
            }
            var s = document.createElement('script');
            s.src = snapConfig.midtransSnapUrl;
            s.setAttribute('data-client-key', snapConfig.midtransClientKey);
            s.onload = callback;
            document.head.appendChild(s);
        }

        // Buka ulang popup Snap dengan token yang sama
        function reopenSnapPopup() {
            if (!lastToken) return;
            loadSnapThenPay(function () { snapPay(lastToken); });
        }

        // Batalkan order yang belum dibayar → tampilkan tombol beli lagi
        function batalkanOrder() {
            if (!confirm('Batalkan pesanan ini dan buat pesanan baru?')) return;
            sessionStorage.removeItem('ebookOrder_' + ebookId);
            sessionStorage.removeItem('ebookToken_' + ebookId);
            sessionStorage.removeItem('ebookRedirect_' + ebookId);
            lastToken = null;
            lastRedirectUrl = null;
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
            renderBuyArea();
        }

        // ============================================================
        //  🔥 INIT
        // ============================================================
        loadSnapConfig();
        loadEbookDetail();
    </script>

</body>
</html>
