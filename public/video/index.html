<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light only" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <title>Video E-Course - QUALITY OF LOVE</title>

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="/css/style.css" />

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="/firebase-config.js"></script>
</head>
<body>

    <div class="app">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="logo"><img src="/img/Quality.jpeg" alt="QUALITY OF LOVE" style="height:38px;width:38px;border-radius:10px;display:block;" /><strong>QUALITY OF LOVE</strong></div>
            <div style="display:flex;align-items:center;gap:10px;">
                <span class="badge">Beta</span>
                <div class="user-area" id="userArea">
                    <!-- Akan diisi JavaScript -->
                </div>
            </div>
        </div>

        <!-- ===== KONTEN VIDEO ===== -->
        <div class="card">
            <h1 style="font-size:22px;font-weight:700;color:#1d3b36;margin-bottom:4px;">🎬 Video E-Course</h1>
            <p style="color:#5a6f6a;font-size:14px;margin-bottom:16px;">Video pembelajaran praktis tentang komunikasi, konflik, keintiman, dan banyak lagi</p>

            <div id="videoContainer">
                <div class="loading-text">⏳ Memuat video...</div>
            </div>
        </div>

        <!-- ===== BOTTOM NAV ===== -->
        <div class="bottom-nav">
            <a href="/">
                <span class="nav-icon">🏠</span>
                Beranda
            </a>
            <a href="/relationship-check">
                <span class="nav-icon">💕</span>
                Health
            </a>
            <a href="/love-language">
                <span class="nav-icon">❤️</span>
                Love
            </a>
            <a href="/artikel?tab=artikel">
                <span class="nav-icon">📰</span>
                Artikel
            </a>
            <a href="/video" class="active">
                <span class="nav-icon">🎥</span>
                Video
            </a>
            <a href="/profil">
                <span class="nav-icon">👤</span>
                Profil
            </a>
        </div>

    </div>

    <script>

        // ============================================================
        //  FIREBASE AUTH - RENDER USER
        // ============================================================
        firebase.auth().onAuthStateChanged((user) => {
            const userArea = document.getElementById('userArea');
            if (user) {
                const foto = user.photoURL || '';
                const nama = user.displayName || 'Pengguna';
                userArea.innerHTML = `
                    <button class="profile-trigger" onclick="toggleDropdown()">
                        ${foto ? `<img src="${foto}" class="avatar" />` : `<div class="avatar-placeholder">👤</div>`}
                    </button>
                    <div class="user-dropdown" id="userDropdown">
                        <a href="/profil" class="dropdown-item">👤 Profil</a>
                        <a href="/hasil" class="dropdown-item">📊 Hasil</a>
                        <a href="/love-language" class="dropdown-item">❤️ Love Language</a>
                        <a href="/relationship-check" class="dropdown-item">💕 Health Check</a>
                        <a href="/artikel" class="dropdown-item">📰 Artikel</a>
                        <a href="/artikel?tab=ebook" class="dropdown-item">📚 Ebook</a>
                        <a href="/video" class="dropdown-item">🎥 Video</a>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item logout" onclick="logout()">🚪 Logout</button>
                    </div>
                `;
            } else {
                userArea.innerHTML = `
                    <button class="profile-trigger" onclick="window.location.href='/login'">
                        <div class="avatar-placeholder">👤</div>
                    </button>
                `;
            }
        });

        function toggleDropdown() {
            const d = document.getElementById('userDropdown');
            if (d) d.classList.toggle('show');
        }

        document.addEventListener('click', function(e) {
            const area = document.getElementById('userArea');
            if (area && !area.contains(e.target)) {
                const d = document.getElementById('userDropdown');
                if (d) d.classList.remove('show');
            }
        });

        function logout() {
            if (confirm('Yakin ingin logout?')) {
                firebase.auth().signOut().then(() => {
                    window.location.reload();
                });
            }
        }

        // ============================================================
        //  🔥 AMBIL VIDEO DARI FIRESTORE (link YouTube)
        // ============================================================
        async function loadVideos() {
            const container = document.getElementById('videoContainer');

            try {
                const snapshot = await db.collection('videos')
                    .orderBy('createdAt', 'desc')
                    .limit(50)
                    .get();

                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">🎬</div>
                            <p>Belum ada video yang ditambahkan.</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                snapshot.forEach(doc => {
                    const v = doc.data();
                    const tanggal = v.createdAt ? new Date(v.createdAt.toDate()).toLocaleDateString('id-ID') : '-';
                    const urlAman = (v.url || '').replace(/'/g, "\\'");
                    const judulAman = (v.title || '').replace(/'/g, "\\'");
                    const thumb = getYoutubeThumb(v.url);
                    html += `
                        <div class="artikel-card" onclick="bukaVideo('${urlAman}', '${judulAman}')">
                            ${thumb ? `<img src="${thumb}" alt="Video" style="width:100%;border-radius:12px;margin-bottom:10px;display:block;" />` : ''}
                            <span class="kategori">🎥 Video · ⏱ ${window.escapeHtml(v.duration || '-')}</span>
                            <h3>${window.escapeHtml(v.title)}</h3>
                            <div class="desc">${window.escapeHtml(v.desc || '')}</div>
                            <div class="meta">📅 ${tanggal}</div>
                        </div>
                    `;
                });
                container.innerHTML = html;

            } catch (error) {
                console.error('Error loading videos:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">❌</div>
                        <p>Gagal memuat video. Silakan refresh halaman.</p>
                    </div>
                `;
            }
        }

        // ─── PARSING URL YOUTUBE → ID / EMBED / THUMBNAIL ───
        function getYoutubeEmbedUrl(url) {
            if (!url) return null;
            var id = null;
            var m;
            // youtube.com/watch?v=ID
            m = url.match(/[?&]v=([A-Za-z0-9_-]{11})/);
            if (m) id = m[1];
            // youtu.be/ID
            if (!id) {
                m = url.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);
                if (m) id = m[1];
            }
            // youtube.com/shorts/ID
            if (!id) {
                m = url.match(/youtube\.com\/shorts\/([A-Za-z0-9_-]{11})/);
                if (m) id = m[1];
            }
            // youtube.com/embed/ID
            if (!id) {
                m = url.match(/youtube\.com\/embed\/([A-Za-z0-9_-]{11})/);
                if (m) id = m[1];
            }
            if (!id) return null;
            return 'https://www.youtube.com/embed/' + id + '?rel=0&autoplay=1';
        }

        function getYoutubeThumb(url) {
            var embed = getYoutubeEmbedUrl(url);
            if (!embed) return null;
            var id = embed.split('/embed/')[1].split('?')[0];
            return 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg';
        }

        // ─── PLAYER MODAL (iframe embed — nonton di dalam website) ───
        function bukaVideo(url, title) {
            if (!url) {
                alert('Link video belum tersedia.');
                return;
            }
            var embed = getYoutubeEmbedUrl(url);
            if (!embed) {
                // Bukan YouTube — fallback buka di tab baru seperti sebelumnya
                window.open(url, '_blank', 'noopener');
                return;
            }

            var lama = document.getElementById('videoModal');
            if (lama) lama.remove();

            var modal = document.createElement('div');
            modal.id = 'videoModal';
            modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;';
            modal.onclick = function (e) { if (e.target === modal) tutupVideo(); };
            modal.innerHTML =
                '<div style="background:#fff;border-radius:20px;padding:16px;max-width:760px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,0.4);">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;">' +
                '<strong style="color:#1d3b36;font-size:14px;">🎬 ' + window.escapeHtml(title || 'Video') + '</strong>' +
                '<button onclick="tutupVideo()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#999;">✕</button>' +
                '</div>' +
                '<div style="position:relative;padding-top:56.25%;">' +
                '<iframe src="' + embed + '" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;border-radius:12px;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>' +
                '</div>' +
                '</div>';
            document.body.appendChild(modal);
        }

        function tutupVideo() {
            var modal = document.getElementById('videoModal');
            if (modal) modal.remove();
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') tutupVideo();
        });

        loadVideos();
    </script>

</body>
</html>
